<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Device</title>
    
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    
    <!-- Slick Slider -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css" integrity="sha512-yHknP1/AwR+yx26cB1y0cjvQUMvEa2PFzt1c9LlS4pRQ5NOTZFWbhBig+X9G9eYW/8m0/4OXNx8pxJ6z57x0dw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css" integrity="sha512-17EgCFERpgZKcm0j0fEq1YCJuyAWdz9KUtv1EjVuaOz8pDnh/0nZxmU6BBXwaaxqoi9PQXnRWqlcDB027hgv9A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Style sheet -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="site">
        <header id="top">
            <div class="navbar">
                <div class="open-mobile-nav">
                    <i class="bx bx-menu" ></i>
                </div>

                <div class="open-search">
                    <i class="bx bx-search"></i>

                    <div class="form-search">
                        <form method="get">
                            <input type="text" name="search" id="search" placeholder="O que você está procurando?" />
                            <button class="btnsearch">
                                <i class="bx bx-search"></i>
                            </button>
                        </form>
                    </div>
                </div>

                <div class="open-search-desktop">
                    <form method="get">
                        <input type="text" name="search" id="search" placeholder="O que você está procurando?" />
                        <button class="btnsearch">
                            <i class="bx bx-search"></i>
                        </button>
                    </form>
                </div>

                <div class="logo-wrapper">
                    <h1><a href="#">Smart Device</a></h1>
                </div>

                <a href="#" class="open-minicart">
                    <i class="bx bx-cart"></i>
                    <div class="balloon">
                        <span>0</span>
                    </div>
                </a>
            </div>

            <div class="menu">
                <nav>
                    <ul>
                        <li><a href="#">Acessórios</a></li>
                        <li><a href="#">Fones</a></li>
                        <li><a href="#">Relógios</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <div class="banner-home">
            <div class="banner-item">
                <a href="#">
                    <img src="./assets/img/bg_banner_home01.jpg" alt="Banner Home" />
                </a>
            </div>
            <div class="banner-item">
                <a href="#">
                    <img src="./assets/img/bg_banner_home02.jpg" alt="Banner Home" />
                </a>
            </div>
            <div class="banner-item">
                <a href="#">
                    <img src="./assets/img/bg_banner_home03.jpg" alt="Banner Home" />
                </a>
            </div>
        </div>

        <div class="banner-ruler">
            <ul>
                <li>
                    <span><i class="bx bx-wrist-watch-round"></i></span>
                    <span class="text">Escolha o produto que você deseja</span>
                </li>
                <li>
                    <span><i class="bx bx-cart-check"></i></span>
                    <span class="text">Adicione ao carrinho de compras</span>
                </li>
                <li>
                    <span><i class="bx bx-location"></i></span>
                    <span class="text">Preencha os seus dados</span>
                </li>
                <li>
                    <span><i class="bx bx-message-bubble-reply"></i></span>
                    <span class="text">Finalize sua compra pelo Whatsapp</span>
                </li>
            </ul>
        </div>

        <div class="showcase">
            <div class="header">
                <div class="icon">
                    <span><i class="bx bx-ticket"></i></span>
                </div>
                <div class="text">
                    <span>Aproveite as ofertas</span>
                    <h3>Os mais vendidos</h3>
                </div>
                <div class="separator"></div>
                <a href="#">Veja mais</a>
            </div>

            <div class="content"></div>
        </div>

        <footer></footer>
    </div>
    
    <!-- jQuery -->
    <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <!-- Slick Slider JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js" integrity="sha512-HGOnQO9+SP1V92SrtZfjqxxtLmVzqZpjFFekvzZVWoiASSQgSr4cw9Kqd2+l8Llp4Gm0G8GIFJ4ddwZilcdb8A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>
        var isUnderMaintenance = true; // Defina isso como true para simular a manutenção
        if (isUnderMaintenance) {
            window.location.href = "./maintainance.html";
        }

        document.querySelector('.open-mobile-nav').addEventListener('click', function() {
            document.querySelector('.open-search').classList.remove('active');
            document.querySelector('.form-search').classList.remove('active');
            document.querySelector('.menu').classList.toggle('active');
        });

        document.querySelector('.open-search').addEventListener('click', function() {
            document.querySelector('.menu').classList.remove('active');
            this.classList.toggle('active');
            document.querySelector('.form-search').classList.toggle('active');
        });

        $(document).ready(function () {
            // declaration banner home
            $('.banner-home').slick({
                dots: true,
                infinite: true,
                speed: 400,
                slidesToShow: 1,
                adaptiveHeight: true,
                autoplay: true,
                arrows: true
            });
        });
    </script>
</body>
</html>
